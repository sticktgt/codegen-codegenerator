llm:
  provider: "ollama"
  ollama:
    base_url: "https://ollama.com" # "http://192.168.50.165:18081" #  
    api_key: "216e6158b5814e248dcb998a99d08e35.1bsbhaxOsnSUguqLphUFB3oa"
    timeout_sec: 420 # 600
    think: false
    temperature: 0.0
    num_ctx: 16384 # 4096 # 32768
    num_predict: 900 # 600 # 1200
    keep_alive: 0
    options: {}
    #   num_thread: 6
    #   num_batch: 96
    #   use_mmap: false

codegenerator:
  prompts:
    system_rules: "prompts/system_rules_code_edit.txt"
    planner_user_template: "prompts/planner_user_template.txt"
    coder_user_template: "prompts/coder_user_template.txt"
    repair_user_template: "prompts/repair_user_template.txt"
    test_generator_user_template: "prompts/test_generator_user_template.txt"
    test_generator_example: "prompts/test_example_pytest_raises.txt"
    test_planner_user_template: "prompts/test_planner_user_template.txt"

  models:
    planner_model: "qwen3-coder-next" # "qwen3-coder-next" # "qwen3:14b-q4_K_M" # "gemma4:31b" 
    coder_model: "qwen3-coder-next" # "qwen2.5-coder:14b-instruct-q4_K_M" # "devstral-small-2:24b" 
    test_generator_model: "qwen3-coder-next" # "qwen2.5-coder:7b-instruct" # "devstral-small-2:24b" 
    repair_model: "qwen3-coder-next" # "qwen2.5-coder:14b-instruct-q4_K_M" # "devstral-small-2:24b" #

  generation:
    repair_enabled: true
    max_repair_attempts: 1
    test_generation_mode: "always"
    test_generator_max_example_tests: 1
    coder_prompt_target_chars: 9000 # 5000
    coder_prompt_hard_limit: 9000 # 5400
    coder_max_reference_artifacts: 1
    coder_max_reference_chars: 1400 # 1100
    coder_max_full_file_chars: 900 # 0
    repair_prompt_hard_limit: 9000
    repair_max_reference_chars: 700 # 420
    test_prompt_reference_chars: 700

    test_prompt_related_tests_truncate_chars: 320
    test_prompt_full_file_truncate_chars: 380
    test_prompt_target_truncate_chars: 300

  defaults:
    constraints:
      - "Меняй только указанный target"
      - "Не добавляй внешние зависимости"
      - "Сохраняй стиль окружающего кода"
      - "Не меняй поведение без явного требования"

  trace:
    save_to_file: true
    show_prompts: true
    show_raw_llm_output: true
    output_dir: "runs"

  prompt_budget:
    generate_chars_limit: 9000
    generate_test_chars_limit: 9000
    repair_chars_limit: 9000
    min_user_prompt_chars: 400
    user_prompt_reserve_chars: 100

  prompt_assembly:
    test_reference_max_items: 1
    test_planner_related_tests_max_items: 1
    test_planner_related_tests_per_item_chars: 450
    test_planner_inferred_symbols_count: 20
    test_planner_full_file_chars: 900
    test_planner_related_tests_chars: 450
    test_planner_import_context_chars: 500
    test_planner_inferred_symbols_chars: 300
    test_insert_after_example_chars: 260
    test_insert_after_import_context_chars: 220
    test_insert_after_inferred_symbols_chars: 120
    test_insert_after_request_chars: 180
    test_soft_overflow_chars: 350
